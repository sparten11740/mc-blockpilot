# One daemon configures both Fabric Loom and NeoForge's ModDevGradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Shared by every project in the repository. The Minecraft and loader versions each build targets live with that
# build: blockpilot/versions/<minecraft>-<loader>/gradle.properties.
mod_license=All Rights Reserved
# Version of dev.blockpilot.api; must match BlockpilotApi.VERSION.
api_version=1.0.0
