name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-type: ${{ steps.version.outputs.release-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: The tag matches the mod version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(sed -n 's/^mod_version=//p' blockpilot/gradle.properties)"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod_version $expected in blockpilot/gradle.properties"
            exit 1
          fi
          case "$version" in
            *-alpha*) type=alpha ;;
            *-beta*) type=beta ;;
            *) type=release ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release-type=$type" >> "$GITHUB_OUTPUT"
      - name: Build and test every target
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Collect the jars and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          api_version="$(sed -n 's/^api_version=//p' gradle.properties)"
          mkdir dist
          cp build/libs/blockpilot-"$VERSION"+*.jar dist/
          cp blockpilot-api/build/libs/blockpilot-api-"$api_version".jar dist/
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > dist/release-notes.md
          expected="$(find blockpilot/versions -mindepth 2 -maxdepth 2 -name gradle.properties | wc -l)"
          if [ "$(ls dist/blockpilot-"$VERSION"+*.jar | wc -l)" -ne "$expected" ]; then
            echo "::error::Expected $expected mod jars for $VERSION in build/libs"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "::error::CHANGELOG.md has no section headed ## $VERSION"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Publishes last, once every upload has gone through.
  github-release:
    needs: [build, curseforge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TYPE: ${{ needs.build.outputs.release-type }}
        run: |
          prerelease=()
          if [ "$RELEASE_TYPE" != release ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" \
            --title "Blockpilot $VERSION" --notes-file dist/release-notes.md dist/*.jar

  curseforge:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: 1.20.1, loader: fabric, loader-name: Fabric, java: 17, dependencies: 'fabric-api:required' }
          - { minecraft: 1.20.1, loader: forge, loader-name: Forge, java: 17, dependencies: '' }
          - { minecraft: 1.21.1, loader: neoforge, loader-name: NeoForge, java: 21, dependencies: '' }
          - { minecraft: 1.21.1, loader: fabric, loader-name: Fabric, java: 21, dependencies: 'fabric-api:required' }
          - { minecraft: 1.21.11, loader: neoforge, loader-name: NeoForge, java: 21, dependencies: '' }
          - { minecraft: 1.21.11, loader: fabric, loader-name: Fabric, java: 21, dependencies: 'fabric-api:required' }
          - { minecraft: 26.1.2, loader: neoforge, loader-name: NeoForge, java: 25, dependencies: '' }
          - { minecraft: 26.1.2, loader: fabric, loader-name: Fabric, java: 25, dependencies: 'fabric-api:required' }
          - { minecraft: '26.2', loader: neoforge, loader-name: NeoForge, java: 25, dependencies: '' }
          - { minecraft: '26.2', loader: fabric, loader-name: Fabric, java: 25, dependencies: 'fabric-api:required' }
          - { minecraft: '26.3', loader: neoforge, loader-name: NeoForge, java: 25, dependencies: '' }
          - { minecraft: '26.3', loader: fabric, loader-name: Fabric, java: 25, dependencies: 'fabric-api:required' }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: sparten11740/mod-publish-actions/curseforge/upload@v1
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          file: dist/blockpilot-*+${{ matrix.minecraft }}-${{ matrix.loader }}.jar
          display-name: Blockpilot ${{ needs.build.outputs.version }} for ${{ matrix.loader-name }} ${{ matrix.minecraft }}
          game-versions: ${{ matrix.minecraft }}
          loaders: ${{ matrix.loader }}
          java-versions: ${{ matrix.java }}
          environment: client
          release-type: ${{ needs.build.outputs.release-type }}
          changelog-file: dist/release-notes.md
          dependencies: ${{ matrix.dependencies }}
