name: game tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: Targets to test, comma-separated, such as 26.3-fabric; all when empty
        required: false
        default: ''

permissions:
  contents: read

# A newer push tests every commit an older run would have; a run by hand doesn't cancel a push's run.
concurrency:
  group: game-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the targets
        id: list
        env:
          CHOSEN: ${{ inputs.targets }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          configured = subprocess.run(["python3", "tools/test_targets.py", "--list"], check=True, capture_output=True,
                                      text=True).stdout.split()
          chosen = os.environ.get("CHOSEN", "").replace(",", " ").split() or configured
          unknown = [target for target in chosen if target not in configured]
          if unknown:
              raise SystemExit(f"::error::Unknown targets {unknown}; these exist: {' '.join(configured)}")
          print("targets=" + json.dumps(chosen))
          EOF

  test:
    needs: targets
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install a virtual display, software rendering and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libegl1 libvulkan1 \
            mesa-vulkan-drivers libxcursor1 libxrandr2 libxi6 libxinerama1 libxxf86vm1 libxtst6 ffmpeg
      - name: Draw four chunks far, so that software rendering keeps up
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "blockpilot/versions/$TARGET/run"
          echo "renderDistance:4" > "blockpilot/versions/$TARGET/run/options.txt"
      - name: Point Gradle at each Java
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" \
            >> ~/.gradle/gradle.properties
      - name: Test ${{ matrix.target }}
        timeout-minutes: 50
        env:
          TARGET: ${{ matrix.target }}
          # OpenAL Soft's output that plays nothing: the runner has no sound card, and the game's sound engine needs a
          # device to load, which recording with sound then captures through a loopback device.
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s "-screen 0 1280x720x24" python3 tools/test_targets.py --targets "$TARGET" --strict-skips
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: game-tests-${{ matrix.target }}
          path: build/test-targets/${{ matrix.target }}/
          if-no-files-found: warn

  # Fails the run for what only shows across targets, and for a target whose job left no results.
  combine:
    needs: [targets, test]
    if: always() && needs.targets.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: game-tests-*
          path: artifacts
      - name: Combine the targets' results
        env:
          TARGETS: ${{ join(fromJSON(needs.targets.outputs.targets), ',') }}
        run: |
          mkdir -p build/test-targets artifacts
          for artifact in artifacts/game-tests-*; do
            [ -d "$artifact" ] && mv "$artifact" "build/test-targets/${artifact#artifacts/game-tests-}"
          done
          status=0
          python3 tools/test_targets.py --combine --strict-skips --targets "$TARGETS" > report.txt || status=$?
          cat report.txt
          { echo '### Game tests'; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
